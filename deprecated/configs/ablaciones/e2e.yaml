# Ablación de punta a punta sobre ambientes_vacios/ (Ejercicio 2):
#   uv run amoblai ablation configs/ablaciones/e2e.yaml
#
# Usa los generadores de base.yaml (manual por defecto). La imagen 1 de cada
# ambiente se genera una sola vez y queda en la caché (resultados/generaciones/):
# todas las variantes del generador n.º 2 parten de la misma imagen 1.
# Para correr por API: --set en base o un YAML propio con provider: openai.

kind: e2e
name: abl-e2e
base: ../base.yaml

incremental:
  - name: G0-imagen1-single
    set: { generation.gen2_base: image1, generation.gen2_mode: single }
  - name: G1-original-single
    set: { generation.gen2_base: original, generation.gen2_mode: single }
  - name: G2-imagen1-por-mueble
    set: { generation.gen2_base: image1, generation.gen2_mode: per_item }
  - name: G3-original-por-mueble
    set: { generation.gen2_base: original, generation.gen2_mode: per_item }
