# Tests de la v0 (retrieval por imagen). Desde la raíz del repo:
#   PYTHONPATH=deprecated uv run pytest -c deprecated/pytest.ini
[pytest]
testpaths = tests
pythonpath = . tests
addopts = -m "not models" -p no:cacheprovider
markers =
    models: tests que descargan modelos de Hugging Face (lentos, requieren red)
