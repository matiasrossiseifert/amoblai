name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias (torch CPU)
        run: uv sync --extra cpu --extra imagen --group dev
      - name: Ruff
        run: |
          uv run ruff check src tests apps
          uv run ruff format --check src tests apps
      - name: Tests del TP y de roomrag (sin modelos ni red)
        run: uv run pytest -q
      - name: Tests de la v0 (deprecated)
        run: PYTHONPATH=deprecated uv run pytest -c deprecated/pytest.ini -q
