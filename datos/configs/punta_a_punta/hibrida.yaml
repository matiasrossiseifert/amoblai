# Versión 1 contra versión 2, de punta a punta en los 11 ambientes de pedidos.yaml, con el mismo
# plan y el mismo juez de listas (Opus, de a pares, en los dos órdenes):
# - densa: el flujo como está (búsqueda densa sobre las descripciones, filtro por kind);
# - hibrida: lo mismo con rag.hybrid (densa + léxica BM25 + la foto del producto con SigLIP 2).
# Es el único cambio. Las listas de `densa` salen de las corridas del 10/11 (catalogos/todos),
# salvo los dos ambientes donde el arreglo del filtro de medidas (2026-11-12) cambia los
# candidatos de la alfombra: esos se eligieron de nuevo, para que las dos variantes usen el mismo
# filtro. Costo: unos US$3 (choose de los 11 con la híbrida y de 2 con la densa; 22 llamadas al juez).
# `uv run amoblai evaluar-punta-a-punta datos/configs/punta_a_punta/hibrida.yaml --pagar`
ambientes: datos/ambientes_vacios/pedidos.yaml
salida: datos/resultados/punta_a_punta/hibrida
plan_de: densa
variantes:
  densa: {rag.hybrid: []}
  hibrida: {rag.hybrid: [bm25, siglip2]}
comparaciones:
  - [densa, hibrida]
