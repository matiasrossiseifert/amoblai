# Mapeo explícito y revisable: valores de `type` del dataset IKEA → categorías del alcance v1.
#
# - Los `type` que no figuran acá quedan con category = "other": se indexan igual
#   (sirven como distractores en la ablación sin filtro), pero nunca se buscan.
# - `detector_labels`: frases en inglés que recibe el detector de vocabulario abierto.
#   Cada frase se mapea a la categoría donde aparece.
# - Los tipos marcados "dudoso" se discutieron en la propuesta del plan; `excluded`
#   documenta los que quedaron afuera y por qué.
# - `amoblai categories` genera resultados/mapeo_categorias.md con los conteos.

categories:
  sofa:
    name_es: sofá
    detector_labels: [sofa, couch]
    ikea_types:
      - Three-seat sofa
      - Two-seat sofa
      - Three-seat sofa-bed
      - Two-seat sofa-bed
      - Two-seat sofa with chaise longue
      - Two-seat sofa w chaise longue left
      - Two-seat sofa w chaise longue right
      - Two-seat sofa and chaise longue
      - 3-seat sofa with 2 chaise longues
      - 3-seat sofa with bed
      - Chaise longue               # dudoso → incluido

  armchair:
    name_es: sillón
    detector_labels: [armchair]
    ikea_types:
      - Armchair
      - Armchair with cushion
      - Easy chair
      - Wing chair
      - High-back armchair
      - Swivel armchair
      - Swivel easy chair
      - Rocking-chair               # dudoso → incluido

  chair:
    name_es: silla
    detector_labels: [chair, dining chair]
    ikea_types:
      - Chair
      - Chair with armrests
      - Chair with long cover
      - Folding chair

  table:
    name_es: mesa
    detector_labels: [table, dining table, coffee table, side table]
    ikea_types:
      - Table
      - Coffee table
      - Side table
      - Extendable table
      - Drop-leaf table
      - Gateleg table
      - Pedestal table
      - Nest of tables, set of 2
      - Console table
      - Side table on castors
      - Bar table                   # dudoso → incluido
      - Tray table                  # dudoso → incluido
      - Storage table               # dudoso → incluido
      - Table with drawers          # dudoso → incluido

  rug:
    name_es: alfombra
    detector_labels: [rug, carpet]
    ikea_types:
      - Rug
      - Rug, flatwoven
      - Rug, low pile
      - Rug, high pile
      - Rug, braided
      - Sheepskin                   # dudoso → incluido
      - Cow hide                    # dudoso → incluido

excluded:
  - { type: Cover two-seat sofa, reason: "se vende la funda, no el sofá" }
  - { type: Cover for chaise longue, reason: "se vende la funda, no el mueble" }
  - { type: Swivel chair, reason: "sillas de oficina, fuera de living/comedor" }
  - { type: Swivel chair with armrests, reason: "sillas de oficina, fuera de living/comedor" }
  - { type: Junior chair, reason: "silla infantil" }
  - { type: Stool, reason: "taburete: el detector 'chair' no lo representa (ver FUTURO.md)" }
  - { type: Bar stool, reason: "taburete (ver FUTURO.md)" }
  - { type: Bar stool with backrest, reason: "taburete (ver FUTURO.md)" }
  - { type: Wall-mounted drop-leaf table, reason: "mesa de pared, no es un mueble apoyado" }
