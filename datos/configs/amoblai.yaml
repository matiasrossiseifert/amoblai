# Config del TP: el catálogo, la búsqueda, el flujo de amoblado, la evaluación y los topes de
# gasto. Cada campo está explicado en src/amoblai/config.py. Rutas de entrada relativas a `root`
# (la raíz del repo); cache_dir, runs_dir y budget.ledger relativas a donde se corre (la raíz).
name: amoblai
root: .
cache_dir: datos/cache            # descripciones, vectores e índices de ChromaDB: se regeneran gratis
runs_dir: datos/resultados/amoblar  # una carpeta por corrida (se commitea)

rag:
  # El catálogo del flujo: IKEA + Amazon Berkeley Objects (2026-11-10, punta a punta en 11 ambientes:
  # le gana a IKEA solo 8 a 2, p = 0,11; en los pedidos nórdicos empatan, en los de otros estilos
  # gana 6 a 0, con pedidos escritos sabiendo qué le falta a IKEA: docs/EXPERIMENTOS.md, T3b).
  # Las evaluaciones con el ground truth de IKEA usan siempre datos/catalogo/ikea.yaml (cli.IKEA_GT).
  catalog: datos/catalogo/todos.yaml
  mode: rag                       # o whole_catalog: todo lo que pasa los filtros, sin ranking
  top_k: 3                        # solo para `amoblai buscar`; el flujo trae furnish.candidates por pieza
  describer: written_todos        # las ocho líneas: IKEA por subagentes, ABO por la API (mismo formato)
  describers:
    written: {kind: written, file: datos/catalogo/descripciones.jsonl}
    # el catálogo ABO (rag.catalog: datos/catalogo/abo/abo.yaml) y los dos juntos (todos.yaml)
    written_abo: {kind: written, file: datos/catalogo/abo/descripciones.jsonl}
    written_todos: {kind: written, file: [datos/catalogo/descripciones.jsonl, datos/catalogo/abo/descripciones.jsonl]}
    fields: {kind: fields}        # línea de base: el texto del vendedor (nombre, colores, desc)
  embedder: qwen3                 # el mejor de la ablación
  # La base vectorial: ChromaDB (índice HNSW, espacio coseno; los filtros van como `where`).
  # `exact` recorre todos los vectores con numpy: es la línea de base de la ablación.
  vector_store: chroma
  hnsw: {ef_search: 100, max_neighbors: 16}
  # Búsqueda híbrida (versión 2 del flujo, 2026-11-12): al coseno del embedder se le fusionan la
  # búsqueda léxica (BM25 sobre las descripciones) y la foto del producto contra la consulta
  # (SigLIP 2), cada puntaje estandarizado y el promedio. Sobre el ground truth de IKEA sube
  # hit@1 de 0,530 a 0,605 y hit@5 de 0,790 a 0,825 (se repite con los tres redactores); de punta
  # a punta, en 11 ambientes gana 5, empata 6 y no pierde ninguno (docs/EXPERIMENTOS.md, T6c y T8).
  # La versión 1 es la búsqueda densa sola: `--set rag.hybrid=[]`.
  hybrid: [bm25, siglip2]
  fusion: sum
  embedders:
    hashing: {kind: hashing, dim: 1024}                                   # gratis, sin modelo
    bge: {kind: local, model: BAAI/bge-base-en-v1.5, pooling: cls}        # MIT, local
    qwen3: {kind: local, model: Qwen/Qwen3-Embedding-0.6B, pooling: last} # Apache-2.0, local
    # Modelos de imagen y texto (rag/hybrid.py): la consulta en una frase contra la foto del
    # producto, sin descripción. Locales y gratis. Se usan en la ablación hibrido.yaml y en rag.hybrid.
    siglip2: {kind: image_text, model: google/siglip2-base-patch16-224, max_length: 64}
    clip: {kind: image_text, model: openai/clip-vit-base-patch32, max_length: 77}
    openai:                                                               # pago: no usar sin permiso
      kind: openai_embeddings
      model: text-embedding-3-large
      models: {text-embedding-3-large: {usd_per_m: 0.13}}

furnish:
  steps: [plan, retrieve, choose, scene, generate]
  # La imagen: edición estricta del ambiente del usuario, con una plantilla sin LLM (el modelo de
  # imagen acomoda los productos) y con el control SIFT y reintento de furnish.room_check. Contra
  # la escena escrita por el LLM (scene_llm: true, scene_prompt_v2.md) empata en los 11 ambientes
  # (EXPERIMENTOS.md, T10: 31 contra 32 productos reconocidos de 75; ambiente conservado en 7
  # contra 8), y es una llamada y US$0,056 menos por pedido.
  scene_prompt: scene_prompt_libre_v4.md
  scene_llm: false
  max_pieces: null                # sin tope: las piezas que pidan el pedido y el ambiente (search_query_v4)
  # La imagen muestra hasta 13 productos: Nano Banana 2 (fal) acepta 14 imágenes, la foto del
  # ambiente y 13 más ("At most 14 image URLs are allowed", 2026-11-12, con un plan de 15 piezas).
  # Las piezas que sobran (las menos importantes: el plan las ordena) quedan en la lista de compra.
  max_image_products: 13
  candidates: 5                   # por pieza: el LLM ve 5 fotos de cada una y elige la combinación (curva de candidatos, `amoblai evaluar-candidatos`: 3 → 0,637, 5 → 0,667, 8 → 0,689; de 3 a 5, +0,029 [0,015; 0,043])
  photo_max_side: 1024
  # Claude (API de Anthropic) para plan, choose y scene. Precios por 1M de tokens, consultados
  # el 2026-10-21. Opus 5.5 siempre piensa; effort (low..max) regula cuánto (default medium).
  llm:
    kind: anthropic
    model: claude-opus-5-5
    effort: medium
    max_tokens: 16000
    timeout_s: 300
    models:
      # cache_*: lo que cuesta la entrada escrita en la caché de prompt (1,25x a 5 minutos, 2x
      # a 1 hora) y leída de ella (0,05x); solo se usa con rag.mode whole_catalog (2026-11-12).
      claude-opus-5-5:
        usd_per_m: {input: 4.0, output: 20.0, cache_read: 0.20, cache_write_5m: 5.0, cache_write_1h: 8.0}
        estimate_usd: 0.15
      claude-sonnet-5-5:
        usd_per_m: {input: 2.0, output: 10.0, cache_read: 0.10, cache_write_5m: 2.5, cache_write_1h: 4.0}
        estimate_usd: 0.08
      # Haiku solo para el experimento de modelos (2026-11-16): hasta 100 mil tokens de entrada
      # (por encima, 0,50 / 2,50). No es el modelo del flujo.
      claude-haiku-5-5:
        usd_per_m: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write_5m: 0.125, cache_write_1h: 0.20}
        estimate_usd: 0.01
  generator: manual               # gratis: deja una carpeta para pegar en ChatGPT o Gemini
  generators:
    manual: {kind: manual}
    nano_banana_2:                # Nano Banana 2 (Gemini 3.1 Flash Image) por fal
      kind: "amoblai.furnish.image_models:FalNanoBanana"
      endpoint: fal-ai/nano-banana-2/edit
      resolution: 1K
      aspect_ratio: auto          # dibuja en la proporción de la foto
      usd_per_image: {1K: 0.08, 2K: 0.12, 4K: 0.16}
    openai:                       # gpt-image por images.edit; queda poco saldo: no usar sin permiso
      kind: "amoblai.furnish.image_models:OpenAIImage"
      model: gpt-image-2
      quality: medium
      estimate_usd: 0.12
    # El experimento de modelos de imagen (2026-11-16, `amoblai comparar-imagen`): las mismas
    # listas y el mismo prompt de las imágenes finales, un intento por modelo. Precios de fal y de
    # OpenAI consultados el 2026-11-16.
    nano_banana_pro:              # Nano Banana Pro (Gemini 3 Pro Image) por fal, hasta 14 imágenes
      kind: "amoblai.furnish.image_models:FalNanoBanana"
      endpoint: fal-ai/nano-banana-pro/edit
      resolution: 1K
      aspect_ratio: auto
      usd_per_image: {1K: 0.15, 2K: 0.15, 4K: 0.30}
    seedream_45:                  # Seedream 4.5 (ByteDance) por fal: hasta 10 imágenes de entrada
      kind: "amoblai.furnish.image_models:FalNanoBanana"
      endpoint: fal-ai/bytedance/seedream/v4.5/edit
      resolution: 2K
      image_size: auto_2K         # no tiene 1K: su mínimo es 2560x1440 píxeles en total
      max_images_in: 10           # la foto del ambiente y los primeros 9 productos
      usd_per_image: {2K: 0.04}
    gpt_image_2:                  # el mismo de `openai`, con su nombre (gpt-image-2, el actual)
      kind: "amoblai.furnish.image_models:OpenAIImage"
      model: gpt-image-2
      quality: medium
      estimate_usd: 0.15
    gpt_image_15:                 # el modelo anterior de OpenAI
      kind: "amoblai.furnish.image_models:OpenAIImage"
      model: gpt-image-1.5
      quality: medium
      usd_per_m: {text_input: 5.0, image_input: 8.0, image_output: 32.0}
      estimate_usd: 0.15
    gpt_image_mini:               # el chico de OpenAI
      kind: "amoblai.furnish.image_models:OpenAIImage"
      model: gpt-image-1-mini
      quality: medium
      usd_per_m: {text_input: 2.0, image_input: 2.5, image_output: 8.0}
      estimate_usd: 0.05

evaluation:
  # Ablación de post-retrieval: un VLM reordena el top de la búsqueda mirando las fotos de los
  # candidatos (evaluation/retrieval.py). Los mismos modelos y effort que el flujo (Haiku, solo en el
  # experimento de modelos del 2026-11-16).
  rerank_top: 10
  rerankers:
    minilm-reranker:  # cross-encoder local (gratis), el BERT chico de MS MARCO de las demos
      kind: cross_encoder
      head: classification
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
    qwen3-reranker:  # cross-encoder local (gratis): lee la consulta y la descripción juntas
      kind: cross_encoder
      model: Qwen/Qwen3-Reranker-0.6B
      instruction: Given the description of a home furnishing product seen in a room photo, judge whether the catalog product description describes that same product
      batch: 5
    opus:
      kind: anthropic
      model: claude-opus-5-5
      effort: medium
      max_tokens: 16000
      timeout_s: 300
      models:
        claude-opus-5-5: {usd_per_m: {input: 4.0, output: 20.0}, estimate_usd: 0.06}  # medido: ~US$0,02 por llamada; no cambiar: es parte de la clave de la caché
    sonnet:
      kind: anthropic
      model: claude-sonnet-5-5
      effort: medium
      max_tokens: 16000
      timeout_s: 300
      models:
        claude-sonnet-5-5: {usd_per_m: {input: 2.0, output: 10.0}, estimate_usd: 0.03}
    haiku:        # experimento de modelos (2026-11-16): el más chico, solo para comparar
      kind: anthropic
      model: claude-haiku-5-5
      effort: medium
      max_tokens: 16000
      timeout_s: 300
      models:
        claude-haiku-5-5: {usd_per_m: {input: 0.10, output: 0.50}, estimate_usd: 0.002}
    opus-texto:   # experimento 5b: el mismo Opus, con las descripciones de los candidatos en vez de sus fotos
      kind: anthropic
      model: claude-opus-5-5
      effort: medium
      max_tokens: 16000
      timeout_s: 300
      photos: false
      prompt: rerank_candidates_text_v1.md
      models:
        claude-opus-5-5: {usd_per_m: {input: 4.0, output: 20.0}, estimate_usd: 0.04}

budget:
  # Lo que no tiene cuenta propia (OpenAI) queda en 0: cualquier llamada se rechaza.
  max_usd_total: 0.0
  # Topes propios, sobre lo gastado en total por cuenta (el registro: budget.ledger).
  # anthropic: US$50 el 2026-11-12 (antes US$30 desde el 2026-11-09; a discreción, un gasto
  # grande se aprueba aparte). fal: US$8,50 el 2026-11-12 (quedaban unos US$5,5 de saldo: las imágenes de la
  # configuración final; antes 3,23, 1,70, 1,60 y 0,80). openai: US$0,50 el 2026-11-12 (solo para
  # comparar el embedding text-embedding-3-large: centavos).
  # anthropic: US$63 el 2026-11-15 (25 más, habilitados para los experimentos sin imágenes).
  # anthropic: US$78 el 2026-11-16 (el usuario subió el tope de la cuenta y quedan US$20: los
  # experimentos de modelos). openai: US$9 el 2026-11-16 (clave nueva, unos US$10 de saldo).
  accounts: {anthropic: 78.0, fal: 8.5, openai: 9.0}
  allow_paid: false               # se habilita a propósito con --pagar (o --set budget.allow_paid=true)
  ledger: datos/resultados/gastos.jsonl
