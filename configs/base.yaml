# Configuración por defecto de la v1. Cada experimento hereda de acá con
# `extends: ../base.yaml` y pisa solo lo que cambia. Todos los campos están
# documentados en src/amoblai/config.py.

name: base
device: auto          # cuda si hay GPU NVIDIA, si no cpu
seed: 0

embedding:
  name: dinov2        # dinov2 | dinov3 (gated) | clip | siglip2
  batch_size: 16

preprocess:
  pad_to_square: true
  pad_margin: 0.05

index:
  scope_only: false   # se indexa todo el catálogo (ver docs/ARQUITECTURA.md)

detection:
  provider: grounding_dino
  box_threshold: 0.30

background:
  method: sam         # none | sam | rembg
  skip_categories: []

retrieval:
  top_k: 10
  category_filter: true
  threshold: auto     # calibrado por colección en configs/umbrales.yaml

rerank:
  enabled: false      # iteración del Ejercicio 4

generation:
  working_max_side: 1536
  generator1:
    provider: manual  # manual | openai | gemini | dry_run
    model: gpt-image-2
    quality: medium   # low | medium durante el desarrollo; high solo para finales
    manual_app: chatgpt
  generator2:
    provider: manual
    model: gpt-image-2
    quality: medium
    manual_app: chatgpt
  gen2_base: image1   # image1 | original
  gen2_mode: single   # single | per_item
  composite: false

budget:
  dry_run: false
  max_calls_per_run: 20
  max_usd_per_run: 3.0
  max_usd_total: 50.0

eval:
  ks: [1, 5, 10]
  bootstrap_samples: 1000
