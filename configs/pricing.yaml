# Precios en USD por millón de tokens, aplicados a los tokens del campo `usage`
# de cada respuesta. Fuentes (consultadas el 2026-10-06):
#   https://developers.openai.com/api/docs/pricing
#   https://ai.google.dev/gemini-api/docs/pricing
# Verificar antes de correr experimentos pagos: los precios cambian.
#
# est_*: solo para estimar el costo ANTES de llamar (control de presupuesto).
# Para gpt-image se usan los tokens de salida publicados para gpt-image-1
# (1024x1024: low 272, medium 1056, high 4160), normalizados por megapíxel.

batch_discount: 0.5

providers:
  openai:
    gpt-image-2:
      text_input: 5.00
      image_input: 8.00
      image_output: 30.00
      est_output_tokens_per_mpx: { low: 260, medium: 1010, high: 3970 }
    gpt-image-2.5-flare:
      text_input: 5.00
      image_input: 8.00
      image_output: 30.00
      est_output_tokens_per_mpx: { low: 260, medium: 1010, high: 3970 }
    gpt-image-2.5-sunburst:
      text_input: 5.00
      image_input: 8.00
      image_output: 30.00
      est_output_tokens_per_mpx: { low: 260, medium: 1010, high: 3970 }
    gpt-image-1.5:
      text_input: 5.00
      image_input: 8.00
      image_output: 32.00
      est_output_tokens_per_mpx: { low: 260, medium: 1010, high: 3970 }
    gpt-image-1-mini:
      text_input: 2.00
      image_input: 2.50
      image_output: 8.00
      est_output_tokens_per_mpx: { low: 260, medium: 1010, high: 3970 }

  gemini:
    # Gemini cobra igual texto e imagen de entrada; la salida es ~1120 tokens por imagen 1K.
    gemini-3.1-flash-image:
      text_input: 0.50
      image_input: 0.50
      image_output: 60.00
      est_output_tokens_per_mpx: { medium: 1100 }
      est_input_tokens_per_image: 1100
    gemini-3.1-flash-lite-image:
      text_input: 0.25
      image_input: 0.25
      image_output: 30.00
      est_output_tokens_per_mpx: { medium: 1100 }
      est_input_tokens_per_image: 1100
    gemini-3-pro-image:
      text_input: 2.00
      image_input: 2.00
      image_output: 120.00
      est_output_tokens_per_mpx: { medium: 1100 }
      est_input_tokens_per_image: 1100
