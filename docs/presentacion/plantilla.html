<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amoblai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efe9e1; --paper: #fbf8f4; --card: #ffffff; --ink: #1f1c19; --muted: #6f675e;
  --line: #d8cfc4; --grid: #e5ddd3; --bar: #cdbfae; --accent: #b0532c; --accent-soft: #f3e2d8;
  --good: #3f6b4a; --good-soft: #e1ece2; --warn: #9a6b12;
  --serif: "Fraunces", Georgia, serif; --sans: "Inter", "Noto Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; --code-head: #f6f0e9;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
body { overflow: hidden; }
#deck { position: fixed; inset: 0; display: grid; place-items: center; }
.slide {
  position: absolute; width: 1280px; height: 720px; background: var(--paper);
  padding: 46px 60px 40px; display: none; flex-direction: column; overflow: hidden;
  transform-origin: center center; box-shadow: 0 10px 40px rgba(60, 40, 20, .12);
}
.slide.on { display: flex; }
.slide > .foot { position: absolute; left: 60px; right: 60px; bottom: 16px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
h1 { font-family: var(--serif); font-weight: 650; font-size: 64px; line-height: 1.02; margin: 0; letter-spacing: -.01em; }
h2 { font-family: var(--serif); font-weight: 650; font-size: 38px; line-height: 1.1; margin: 0 0 18px; letter-spacing: -.005em; }
h3 { font-size: 18px; margin: 0 0 8px; font-weight: 650; }
p, li { font-size: 19px; line-height: 1.42; }
p { margin: 0 0 12px; }
ul { margin: 0; padding-left: 22px; }
li { margin-bottom: 7px; }
li::marker { color: var(--accent); }
.muted { color: var(--muted); }
.small, .small li { font-size: 16px; }
.tiny { font-size: 13.5px; color: var(--muted); line-height: 1.35; }
b, strong { font-weight: 650; }
.row { display: flex; gap: 34px; align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.center { align-items: center; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.card h3 { margin-bottom: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.big { font-family: var(--serif); font-size: 54px; font-weight: 650; line-height: 1; color: var(--accent); }
.bignote { font-size: 15px; color: var(--muted); margin-top: 6px; line-height: 1.3; }
.q { font-family: var(--serif); font-size: 22px; line-height: 1.25; margin: 0 0 12px; color: var(--ink); }
.why { font-size: 16.5px; line-height: 1.4; margin: 0 0 8px; color: var(--ink); }
.why b { color: var(--accent); }
.coltag { display: block; font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
[data-step] { transition: opacity .25s; }
[data-step].hidden { opacity: 0; visibility: hidden; }
.q::before { content: "¿"; color: var(--accent); }
.decision { margin-top: auto; background: var(--accent-soft); border-left: 5px solid var(--accent); border-radius: 8px; padding: 12px 18px; font-size: 18.5px; line-height: 1.38; }
.decision b { color: var(--accent); }
.find { background: var(--good-soft); border-left: 5px solid var(--good); border-radius: 8px; padding: 10px 16px; font-size: 17px; line-height: 1.38; }
.tag { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
.tag.g { background: var(--good-soft); color: var(--good); }
.pill { display: inline-block; font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 99px; margin: 0 6px 6px 0; background: var(--card); }
.photo { border-radius: 12px; display: block; max-width: 100%; }
.hero .photo { width: 100%; height: 300px; object-fit: cover; }
.fix .photo { width: 100%; object-fit: cover; }
.fix.h180 .photo { height: 180px; }
.fix.h230 .photo { height: 230px; }
.fix.h300 .photo { height: 300px; }
.fix.h120 .photo { height: 120px; }
.fix.h140 .photo { height: 140px; }
.fix.h125 .photo { height: 125px; }
.cap { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
table.t { border-collapse: collapse; width: 100%; font-size: 15.5px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; letter-spacing: .03em; text-transform: uppercase; padding: 6px 10px; border-bottom: 1.5px solid var(--ink); }
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.t tr.hl td { background: var(--accent-soft); font-weight: 600; }
table.t td.n { text-align: right; font-variant-numeric: tabular-nums; }
.chart text, .arch text { font-family: var(--sans); }
.arch { display: block; max-width: 100%; height: auto; }
.chain { display: flex; align-items: center; flex-wrap: nowrap; gap: 4px; margin: -8px 0 14px; font-size: 12.5px; color: var(--muted); }
.chain .st { padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); white-space: nowrap; }
.chain .st.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.chain .st.off { border-style: dashed; color: var(--grid); background: none; }
.chain .ar { color: var(--line); }
.chain .sep { color: var(--line); margin: 0 8px; }
.section { background: var(--ink); color: var(--paper); justify-content: center; }
.section h1 { color: var(--paper); font-size: 72px; }
.section .kicker { color: #e3a481; }
.section p { color: #cfc6bb; font-size: 22px; max-width: 900px; }
.title { justify-content: flex-end; padding-bottom: 70px; }
.formula { font-family: var(--serif); font-size: 21px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; display: inline-block; margin: 4px 0 10px; }
.metric h3 { color: var(--accent); }
.steps { counter-reset: s; }
.steps > div { counter-increment: s; position: relative; padding-left: 44px; margin-bottom: 14px; }
.steps > div::before { content: counter(s); position: absolute; left: 0; top: -2px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 15px; }
/* El recorrido: el mapa que avanza, los extractos de los prompts y sus versiones */
.route { display: block; flex: none; margin: -6px 0 14px; }
.route.mini { margin: -10px 0 8px; }
.route text, .pipe text { font-family: var(--sans); }
.pipe { display: block; max-width: 100%; height: auto; flex: none; }
.pini { display: inline-block; vertical-align: -5px; flex: none; }
.lab { display: block; font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
.prompt, .code { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.prompt .ph, .code .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 14px 5px; border-bottom: 1px solid var(--grid); background: var(--code-head); font-size: 11.5px; color: var(--muted); }
.prompt .ph b, .code .ph b { font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--accent); }
.prompt pre, .code pre { margin: 0; padding: 9px 14px 11px; font-family: var(--mono); font-size: 12.2px; line-height: 1.5; white-space: pre-wrap; color: var(--ink); }
.prompt mark, .code mark { background: var(--accent-soft); color: var(--ink); border-radius: 3px; padding: 1px 2px; font-weight: 600; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.prompt .v, .code .v { color: var(--accent); }
.prompt .cut { color: var(--muted); }
.code .k { color: var(--muted); }
.vers .vr { display: grid; grid-template-columns: 50px 1fr; gap: 10px; align-items: baseline; font-size: 13.6px; line-height: 1.36; padding: 6px 0; border-top: 1px solid var(--grid); color: var(--muted); }
.vers .vr b { color: var(--ink); font-weight: 600; }
.vers .vt { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 0; text-align: center; background: var(--card); }
.vers .now { color: var(--ink); }
.vers .now .vt { background: var(--accent); border-color: var(--accent); color: #fff; }
.dec { display: grid; grid-template-columns: 24px 1fr; gap: 9px; align-items: start; font-size: 15px; line-height: 1.38; margin-bottom: 9px; }
.dec .pini { margin-top: -2px; }
.dec .none { width: 24px; height: 24px; }
.take { margin-top: auto; flex: none; font-family: var(--serif); font-size: 21px; line-height: 1.28; border-left: 4px solid var(--accent); padding: 3px 0 3px 16px; color: var(--ink); }
.take b { color: var(--accent); font-weight: 650; }
.quote { font-size: 15px; line-height: 1.42; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
.quote b { color: var(--accent); font-weight: 600; }
.lines8 { font-size: 12.8px; line-height: 1.38; }
.lines8 div { padding: 2px 0; border-bottom: 1px solid var(--grid); }
.lines8 div:last-child { border-bottom: 0; }
.lines8 div { display: grid; grid-template-columns: 74px 1fr; gap: 6px; }
.lines8 span { color: var(--muted); font-weight: 600; }
.th { background: #fff; border: 1px solid var(--line); border-radius: 7px; display: grid; place-items: center; overflow: hidden; padding: 2px; }
.th img { width: 100%; height: 100%; object-fit: contain; display: block; }
.th.pick { border: 2px solid var(--accent); }
.fix.h70 .photo { height: 70px; border-radius: 8px; }
.fix.h110 .photo { height: 110px; }
.fix.h360 .photo { height: 360px; }
table.t.sm td { padding: 4px 10px; }
table.t.sm th { padding: 4px 10px; }
.lab .vmono { font-family: var(--mono); text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--accent); margin-left: 8px; font-size: 11.5px; }
.who { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.who div { border-top: 2px solid var(--accent); padding-top: 7px; }
.who b { display: block; font-size: 15px; font-weight: 650; }
.who span { display: block; font-size: 13px; line-height: 1.35; color: var(--muted); margin-top: 2px; }
.take .pini { vertical-align: -3px; margin-right: 4px; }
.cand { display: grid; gap: 10px; }
.cand .c { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 9px; text-align: center; }
.cand .c img { width: 100%; height: 104px; object-fit: contain; display: block; }
.cand .c .s { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 4px; }
.cand .c .t { font-size: 12.5px; line-height: 1.25; margin-top: 2px; }
.cand .c.pick { border: 2px solid var(--accent); }
.cand .c .flag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; font-weight: 650; color: #fff; background: var(--accent); border-radius: 99px; padding: 1px 9px; }
.shot { position: relative; }
.shot img { width: 100%; display: block; border-radius: 10px; object-fit: cover; }
.shot .badge { position: absolute; left: 8px; top: 8px; font-size: 12.5px; font-weight: 650; padding: 2px 9px; border-radius: 99px; background: rgba(31,28,25,.78); color: #fff; }
.shot .badge.ok { background: var(--good); }
.shot .badge.no { background: var(--accent); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 34px; }
.legend .li { display: grid; grid-template-columns: 24px 214px 1fr; gap: 8px; align-items: baseline; font-size: 14.3px; padding: 2px 0; border-top: 1px solid var(--grid); }
.legend .li .pini { align-self: center; }
.legend .li b { font-weight: 650; }
.legend .li span { color: var(--muted); font-size: 13.3px; }
#bar { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width .2s; z-index: 5; }
#hint { position: fixed; right: 14px; bottom: 10px; font-size: 12px; color: var(--muted); z-index: 5; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  html, body { overflow: visible; height: auto; background: none; }
  #deck { position: static; display: block; }
  .slide { position: relative; display: flex !important; transform: none !important; box-shadow: none; page-break-after: always; break-after: page; }
  [data-step].hidden { opacity: 1; visibility: visible; }
  #bar, #hint { display: none; }
}
</style>
</head>
<body>
<div id="deck">
__SLIDES__
</div>
<div id="bar"></div>
<div id="hint">← → para avanzar · F pantalla completa</div>
<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  const total = slides.length;
  slides.forEach((s, i) => {
    const f = s.querySelector('.foot .n');
    if (f) f.textContent = `${i + 1} / ${total}`;
  });
  // Pasos dentro de una slide: primero el porqué y el experimento, después los resultados y la
  // decisión ([data-step]). ?todo muestra todo de entrada (para revisar o imprimir).
  const all = new URLSearchParams(location.search).has('todo');
  const steps = (s) => Math.max(0, ...[...s.querySelectorAll('[data-step]')].map(e => +e.dataset.step));
  let step = 0;
  const paint = () => slides[cur].querySelectorAll('[data-step]').forEach(e => e.classList.toggle('hidden', !all && +e.dataset.step > step));
  let cur = Math.min(Math.max(parseInt(location.hash.slice(1)) - 1 || 0, 0), total - 1);
  const fit = () => {
    const k = Math.min(innerWidth / 1280, innerHeight / 720);
    slides.forEach(s => s.style.transform = `scale(${k})`);
  };
  const show = (i, atEnd = false) => {
    cur = Math.min(Math.max(i, 0), total - 1);
    step = atEnd ? steps(slides[cur]) : 0;
    paint();
    slides.forEach((s, j) => s.classList.toggle('on', j === cur));
    document.getElementById('bar').style.width = `${(cur + 1) / total * 100}%`;
    history.replaceState(null, '', `#${cur + 1}`);
  };
  const next = () => { if (!all && step < steps(slides[cur])) { step++; paint(); } else show(cur + 1); };
  const prev = () => { if (!all && step > 0) { step--; paint(); } else if (cur > 0) show(cur - 1, true); };
  addEventListener('resize', fit);
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(total - 1);
    else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  });
  document.getElementById('deck').addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    e.clientX > innerWidth / 3 ? next() : prev();
  });
  setTimeout(() => document.getElementById('hint').style.opacity = 0, 4000);
  fit(); show(cur);
})();
</script>
</body>
</html>
