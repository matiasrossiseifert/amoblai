# Ejemplo de config de roomrag para el TP. Copiala y adaptala; cada campo está explicado en
# roomrag/config.py. Las rutas de entrada (catálogo, fotos, descripciones, prompts) son
# relativas a `root`; cache_dir, runs_dir y budget.ledger, al directorio desde donde se corre.
name: tp-llm
root: .                     # tp-llm/
cache_dir: cache/roomrag    # descripciones, vectores e índice (se reusan entre corridas)
runs_dir: resultados/roomrag

rag:
  catalog: data/processed/catalogo_roomrag.yaml   # a armar: ver LEEME.md, "El catálogo"
  mode: rag                 # o whole_catalog: todo lo que pasa los filtros, sin ranking
  top_k: 3
  describer: written        # las descripciones que escribe Claude Code (LEEME.md)
  describers:
    written: {kind: written, file: data/processed/descripciones.jsonl}
    fields: {kind: fields}  # línea de base: el texto del vendedor
  embedder: hashing         # gratis, línea de base; después bge / qwen3 (locales) u openai
  embedders:
    hashing: {kind: hashing, dim: 1024}
    bge: {kind: local, model: BAAI/bge-base-en-v1.5, pooling: cls}         # MIT, ~0,4 GB
    qwen3: {kind: local, model: Qwen/Qwen3-Embedding-0.6B, pooling: last}  # Apache-2.0, ~1,2 GB
    openai:
      kind: openai_embeddings
      model: text-embedding-3-large
      models: {text-embedding-3-large: {usd_per_m: 0.13}}   # precio por 1M tokens: verificarlo

furnish:
  steps: [plan, retrieve, choose, scene, generate]
  max_pieces: 4             # piezas del plan que siguen (las más importantes primero)
  candidates: 3             # por pieza: el LLM ve 3 fotos de cada una y elige la combinación
  # El LLM que mira fotos y escribe. anthropic (Claude) u openai_chat: cualquier API compatible
  # con OpenAI Chat Completions (OpenAI, el endpoint compatible de Gemini, OpenRouter...).
  # Los precios (US$ por 1M tokens) y el modelo son ejemplos: poner los de la clave que se use.
  llm:
    kind: openai_chat
    model: gpt-6.1-sol
    # base_url: https://generativelanguage.googleapis.com/v1beta/openai   # Gemini (verificar)
    # api_key_env: [GEMINI_API_KEY]
    max_tokens: 16000
    timeout_s: 300
    models:
      gpt-6.1-sol: {usd_per_m: {input: 2.0, output: 10.0}, estimate_usd: 0.08}
  # llm:
  #   kind: anthropic
  #   model: claude-sonnet-5-5
  #   effort: medium
  #   max_tokens: 16000
  #   models:
  #     claude-sonnet-5-5: {usd_per_m: {input: 2.0, output: 10.0}, estimate_usd: 0.08}
  generator: manual         # gratis: deja una carpeta para pegar en ChatGPT o Gemini
  generators:
    manual: {kind: manual}
    # uno por API: una clase del TP con la interfaz de roomrag/generate.py, por ejemplo
    # gemini: {kind: "amoblai.generation.roomrag_adapter:GeminiGenerator", model: ...}

budget:
  max_usd_total: 5.0        # tope de todo lo pago (suma del ledger)
  accounts: {}              # o una cuenta con tope propio, p. ej. {anthropic: 10.0}
  allow_paid: false         # las llamadas pagas se rechazan hasta pasar --set budget.allow_paid=true
  ledger: resultados/roomrag/gastos.jsonl
