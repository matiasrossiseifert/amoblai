[project]
name = "amoblai"
version = "0.1.0"
description = "Amoblado virtual con RAG por texto sobre un catálogo real de muebles (TP 73.69 LLM, ITBA)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Juan Bautista Albertoni Salini" },
    { name = "Matias Juan Rossi Seifert" },
    { name = "Junior Rambau" },
]
dependencies = [
    "chromadb>=1.5",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openai>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "tabulate>=0.9",
    "transformers>=5.0",
    "typer>=0.15",
]

[project.optional-dependencies]
# torch se instala desde el índice de PyTorch que corresponda a la máquina:
#   uv sync --extra cpu   (notebooks/laptops sin GPU NVIDIA, CI)
#   uv sync --extra gpu   (RTX 3070: wheels CUDA 12.6)
cpu = ["torch>=2.6", "torchvision>=0.21"]
gpu = ["torch>=2.6", "torchvision>=0.21"]
# La v0 (retrieval por imagen, deprecated/): segmentación, Gemini, trazas.
imagen = [
    "google-genai>=2.0",
    "langsmith>=0.4",
    "pydantic-settings>=2.6",
    "scikit-image>=0.24",
    "scipy>=1.14",
]
# Eliminación de fondo alternativa de la v0 (rembg + onnxruntime), opcional.
rembg = ["rembg>=2.0.60", "onnxruntime>=1.19"]

[project.scripts]
amoblai = "amoblai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "umap-learn>=0.5.12",
]
apps = ["gradio>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amoblai"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "apps"]
# La v0 congelada sigue su propio estilo.
extend-exclude = ["deprecated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # caracteres ambiguos: los textos están en español
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"apps/*" = ["E501"]  # textos largos de la interfaz
"tests/*" = ["E501"]  # descripciones de ejemplo

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not models'"
markers = [
    "models: tests que descargan modelos de Hugging Face (lentos, requieren red)",
]
